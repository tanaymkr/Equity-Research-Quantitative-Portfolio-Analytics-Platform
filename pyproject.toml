[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "equity-research-quant-platform"
version = "0.1.0"
description = "Equity research, valuation, portfolio analytics, and risk platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Tanay Malekar" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
equity-dcf = "equity_analytics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

